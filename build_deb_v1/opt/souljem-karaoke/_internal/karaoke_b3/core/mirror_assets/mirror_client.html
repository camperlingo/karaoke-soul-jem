<!DOCTYPE html>
<html>
<head>
    <style>body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: black; }</style>
</head>
<body>
    <iframe id="sala" src="about:blank" style="width:100%; height:100%; border:none;"></iframe>
    <script>
        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = (e) => {
            const m = JSON.parse(e.data);
            const frame = document.getElementById("sala");
            if(m.type === "navigate") frame.src = m.url;
            if(m.type === "scroll") {
                window.scrollBy(0, m.value);
                try { frame.contentWindow.scrollBy(0, m.value); } catch(err) {}
            }
        };
    </script>
</body>
</html>
